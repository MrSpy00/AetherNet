[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aethernet"
version = "0.1.0"
description = "AetherNet - WiFi & Network Management Hub"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MrSpy00", url = "https://github.com/MrSpy00" }
]
dependencies = [
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "psutil>=5.9.5",
    "wmi>=1.5.1; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "scapy>=2.5.0",
    "dnspython>=2.4.0",
    "whoisdomain>=0.9.0",
    "requests>=2.31.0",
    "speedtest-cli>=2.1.3",
    "cryptography>=41.0.0",
    "loguru>=0.7.2",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "sqlmodel>=0.0.14"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6"
]

[project.scripts]
aethernet = "aethernet.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

